name: Refresh and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *" # four times a day; new episodes mostly land Friday ~17:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the episode list from YouTube RSS
        run: python3 build.py

      - name: Record newly seen uploads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || { git commit -m "Record new uploads"; git push; }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Report the artifacts this run can see
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[].name] | join(",")' || echo "api-error")
          echo "::notice::artifacts visible before deploy: ${n:-none}"
      - id: deploy
        uses: actions/deploy-pages@v5
