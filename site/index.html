<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Series — watch order</title>
<style>
  :root { --bg:#14161a; --card:#1d2026; --line:#2b2f37; --fg:#e8e8ea; --dim:#9aa0aa; --accent:#e5533d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, -apple-system, sans-serif; padding-bottom:120px; }
  header { padding:16px 16px 8px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; }
  select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:15px; margin-top:10px; width:100%; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px; }
  .chip { border:2px solid var(--c); color:var(--fg); background:transparent; border-radius:999px; padding:6px 12px; font-size:14px; cursor:pointer; opacity:.45; }
  .chip.on { background:color-mix(in srgb, var(--c) 30%, transparent); opacity:1; }
  .session { padding:14px 16px 4px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; display:flex; justify-content:space-between; }
  .ep { display:flex; gap:10px; align-items:center; padding:6px 16px; }
  .ep.watched { opacity:.4; }
  .ep img { width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; border-left:4px solid var(--c); flex:none; }
  .ep .meta { flex:1; min-width:0; }
  .ep .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ep .t a { color:inherit; text-decoration:none; }
  .ep .d { color:var(--dim); font-size:12px; }
  .ep .d b { color:var(--c); font-weight:600; }
  .ep button, .linkbtn { background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px; padding:6px 8px; font-size:13px; cursor:pointer; flex:none; }
  .ep.watched button.w { color:var(--fg); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .go { display:block; width:100%; text-align:center; background:var(--accent); color:#fff; font-weight:600; text-decoration:none; border-radius:10px; padding:12px; font-size:16px; }
  .go.off { background:var(--line); pointer-events:none; }
  .parts { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; font-size:13px; color:var(--dim); align-items:center; }
  .parts a { color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 8px; text-decoration:none; }
  .empty { padding:40px 16px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Life Series — watch order</h1>
  <div class="sub">Every POV, merged by session. Pick your creators, tick what you've seen, hit Continue.</div>
  <select id="season"></select>
</header>
<div class="chips" id="chips"></div>
<main id="list"></main>
<div class="bar">
  <a class="go" id="go" target="_blank" rel="noopener">▶ Continue</a>
  <div class="parts" id="parts"></div>
</div>

<script>
const MAX = 50; // YouTube's watch_videos silently truncates past 50 ids
let DATA, season;
const $ = id => document.getElementById(id);
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem("lso:" + k)) ?? d; } catch { return d; } },
  set: (k, v) => localStorage.setItem("lso:" + k, JSON.stringify(v)),
};
const ytList = ids => "https://www.youtube.com/watch_videos?video_ids=" + ids.join(",");
const fmt = iso => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });

async function init() {
  DATA = await (await fetch("data.json", { cache: "no-cache" })).json();
  const sel = $("season");
  sel.innerHTML = DATA.seasons.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
  sel.value = store.get("season", DATA.seasons[0].id);
  if (!sel.value) sel.value = DATA.seasons[0].id;
  sel.hidden = DATA.seasons.length < 2;
  sel.onchange = () => { store.set("season", sel.value); load(); };
  load();
}

function load() {
  season = DATA.seasons.find(s => s.id === $("season").value);
  render();
}

const picked = () => store.get(season.id + ":creators", season.creators.map(c => c.name));
const watched = () => new Set(store.get(season.id + ":watched", []));
const color = name => season.creators.find(c => c.name === name)?.color || "#888";

function visible() {
  const p = picked(), order = season.creators.map(c => c.name);
  return season.episodes
    .filter(e => p.includes(e.creator))
    .sort((a, b) => a.session - b.session || order.indexOf(a.creator) - order.indexOf(b.creator));
}

function render() {
  const p = picked(), w = watched();
  $("chips").innerHTML = season.creators.map(c =>
    `<button class="chip ${p.includes(c.name) ? "on" : ""}" style="--c:${c.color}" data-c="${c.name}">${c.name}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const cur = picked(), n = b.dataset.c;
    store.set(season.id + ":creators", cur.includes(n) ? cur.filter(x => x !== n) : [...cur, n]);
    render();
  });

  const eps = visible();
  let html = "", last = null;
  for (const e of eps) {
    if (e.session !== last) {
      html += `<div class="session"><span>Episode ${e.session}</span></div>`;
      last = e.session;
    }
    html += `<div class="ep ${w.has(e.id) ? "watched" : ""}" style="--c:${color(e.creator)}">
      <a href="https://www.youtube.com/watch?v=${e.id}" target="_blank" rel="noopener"><img loading="lazy" src="https://i.ytimg.com/vi/${e.id}/mqdefault.jpg" alt=""></a>
      <div class="meta"><div class="t"><a href="https://www.youtube.com/watch?v=${e.id}" target="_blank" rel="noopener">${esc(e.title)}</a></div>
        <div class="d"><b>${e.creator}</b> · ${fmt(e.published)}</div></div>
      <button class="w" data-id="${e.id}" title="Toggle watched">${w.has(e.id) ? "✓" : "○"}</button>
      <button class="upto" data-id="${e.id}" title="Mark everything up to here as watched">⤒</button>
    </div>`;
  }
  $("list").innerHTML = html || `<div class="empty">Pick at least one creator.</div>`;
  $("list").querySelectorAll("button.w").forEach(b => b.onclick = () => toggle(b.dataset.id));
  $("list").querySelectorAll("button.upto").forEach(b => b.onclick = () => upTo(b.dataset.id));

  const todo = eps.filter(e => !w.has(e.id)).map(e => e.id);
  const go = $("go");
  if (todo.length) {
    go.href = ytList(todo.slice(0, MAX));
    go.classList.remove("off");
    go.textContent = `▶ Continue — ${Math.min(todo.length, MAX)} of ${todo.length} left`;
  } else {
    go.removeAttribute("href");
    go.classList.add("off");
    go.textContent = eps.length ? "All caught up 🎉" : "Nothing to play";
  }
  const all = eps.map(e => e.id), parts = [];
  for (let i = 0; i < all.length; i += MAX) parts.push(all.slice(i, i + MAX));
  $("parts").innerHTML = eps.length
    ? `From the start: ` + parts.map((ids, i) => `<a href="${ytList(ids)}" target="_blank" rel="noopener">${parts.length > 1 ? `Part ${i + 1}` : "Full list"}</a>`).join("")
      + ` <span>· ${all.length} videos</span>`
    : "";
}

function toggle(id) {
  const w = watched();
  w.has(id) ? w.delete(id) : w.add(id);
  store.set(season.id + ":watched", [...w]);
  render();
}

function upTo(id) {
  const eps = visible(), idx = eps.findIndex(e => e.id === id), w = watched();
  eps.slice(0, idx + 1).forEach(e => w.add(e.id));
  store.set(season.id + ":watched", [...w]);
  render();
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

init();
</script>
</body>
</html>
